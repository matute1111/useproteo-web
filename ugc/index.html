<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Proteo · UGC</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/icon/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/icon/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&display=swap">
<style>
* { box-sizing: border-box }
body { margin: 0; background: #F6F6F3; color: #17191B; font-family: "Segoe UI", Arial, sans-serif }
main { max-width: 1120px; margin: 0 auto; padding: 40px 32px 48px; display: grid; gap: 32px }
h1 { margin: 0; font: 700 clamp(36px, 5vw, 58px)/1.04 "Bricolage Grotesque", "Segoe UI", sans-serif; letter-spacing: -0.03em }
.videos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px }
video { width: 100%; aspect-ratio: 9 / 16; display: block; border-radius: 20px; background: #17191B; object-fit: cover }
@media (max-width: 760px) { main { padding: 24px 16px 32px; gap: 20px } .videos { grid-template-columns: minmax(0, 1fr) } }
</style>
</head>
<body>
<main>
  <h1>UGC</h1>
  <div class="videos">
    <video src="ugc1.mp4" poster="ugc1.webp" controls playsinline preload="metadata" aria-label="Video UGC 1"></video>
    <video src="ugc2.mp4" poster="ugc2.webp" controls playsinline preload="metadata" aria-label="Video UGC 2"></video>
    <video src="ugc3.mp4" poster="ugc3.webp" controls playsinline preload="metadata" aria-label="Video UGC 3"></video>
  </div>
</main>
<script>
// Suena uno por vez
const vs = [...document.querySelectorAll('video')];
vs.forEach((v) => v.addEventListener('play', () => vs.forEach((o) => { if (o !== v) o.pause() })));
</script>
</body>
</html>
